<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virtual PMS</title>
  <link rel="icon" type="image/png" href="/admin/Favicon.png">
  <style>
    body { margin: 0; display: none; background: transparent; }
    #applist { font-size: 14px; font-family: monospace; color: #333; padding: 10px; }
  </style>
</head>
<body onload="init();">
  <p id="applist"></p>

  <script src="idcap.js"></script>
  <script>
    let hour = 11;
    let min = 0;
    let debugOption = "off";
    let apiKey = "";
    let customerId = null;
    let deviceId = "";
    let tvSerialNumber = "";
    let rebootAfterCheckout = false;
    let dailyCheckoutEnabled = true;

    function log(msg) {
      var el = document.getElementById("applist");
      if (el) el.innerHTML += msg + " <br/>";
    }

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function generateId() {
      try { return crypto.randomUUID().slice(0, 8); } catch(e) {}
      try { return crypto.getRandomValues(new Uint32Array(1))[0].toString(36); } catch(e) {}
      return Math.random().toString(36).slice(2, 10);
    }

    function getDeviceId() {
      try {
        var id = localStorage.getItem("vps_device_id");
        if (id) return id;
        id = "tv-" + generateId();
        localStorage.setItem("vps_device_id", id);
        return id;
      } catch(e) {
        return "tv-" + generateId();
      }
    }

    function getSerialNumber(callback) {
      var stored = null;
      try { stored = localStorage.getItem("vps_serial"); } catch(e) {}
      if (stored) { callback(stored); return; }
      var finished = false;
      var timeoutId = setTimeout(function() { finish(""); }, 3000);
      function finish(value) {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        callback(value || "");
      }
      try {
        idcap.request("idcap://system/info/get", {
          parameters: {},
          onSuccess: function(o) {
            var s = o.serialNo || o.serialNumber || "";
            if (s) {
              try { localStorage.setItem("vps_serial", s); } catch(e) {}
            }
            finish(s);
          },
          onFailure: function() { finish(""); }
        });
      } catch(e) { finish(""); }
    }

    function registerTv() {
      return fetch("/api/checkout/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          api_key: apiKey,
          device_id: deviceId,
          serial_number: tvSerialNumber,
          label: tvSerialNumber || deviceId
        })
      }).then(function(r) {
        return r.json().then(function(data) {
          if (!r.ok) throw new Error(data.error || "Registratie mislukt");
          return data;
        });
      });
    }

    var registrationStarted = false;

    function startRegistration() {
      if (registrationStarted) return;
      registrationStarted = true;
      registerTv().then(function() {
        getTvInfo();
        if (debugOption === "on") {
          document.body.style.display = "block";
        }
        if (dailyCheckoutEnabled) {
          checkout_schedule();
        } else {
          log("Automatische dagelijkse checkout is uitgeschakeld voor deze klant");
        }
        startWipePolling();
      }).catch(function(e) {
        log("FOUT: Registratie mislukt" + (e && e.message ? ": " + e.message : ""));
      });
    }

    function validateApiKey() {
      return fetch("/api/checkout/validate?key=" + encodeURIComponent(apiKey))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.valid) {
            customerId = data.customer_id;
            dailyCheckoutEnabled = data.daily_checkout !== 0;
            rebootAfterCheckout = data.checkout_reboot === 1;
            log("Klant: " + data.customer_name);
            return true;
          } else {
            log("FOUT: " + (data.error || "Ongeldige API key"));
            return false;
          }
        })
        .catch(function() {
          log("FOUT: Kan server niet bereiken");
          return false;
        });
    }

    function logCheckout(success, errorMsg) {
      fetch("/api/checkout/log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          api_key: apiKey,
          device_id: deviceId,
          success: success,
          error_message: errorMsg || null,
          ip_address: null,
          user_agent: navigator.userAgent
        })
      }).catch(function() {});
    }

    var tvIpAddress = "";

    function sendIp(ip) {
      if (ip && customerId) {
        tvIpAddress = ip;
        fetch("/api/checkout/update-ip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_key: apiKey, device_id: deviceId, ip_address: ip })
        }).catch(function() {});
      }
    }

    function getIpViaWebrtc() {
      try {
        var pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel("");
        pc.createOffer().then(function(offer) { pc.setLocalDescription(offer); }).catch(function() {});
        pc.onicecandidate = function(e) {
          if (e.candidate) {
            var m = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
            if (m && m[0] !== "217.100.65.146") sendIp(m[0]);
            pc.close();
          }
        };
        setTimeout(function() { try { pc.close(); } catch(e) {} }, 3000);
      } catch(e) {}
    }

    var getTvInfo = function() {
      try {
        idcap.request("idcap://network/configuration/get", {
          parameters: {},
          onSuccess: function(cbObject) {
            var ip = cbObject.wired && cbObject.wired.ipAddress || cbObject.wireless && cbObject.wireless.ipAddress || "";
            sendIp(ip);
          },
          onFailure: function() { getIpViaWebrtc(); }
        });
      } catch(e) { getIpViaWebrtc(); }
    };

    var runCheckout = function(onDone) {
      log("Checkout wordt uitgevoerd...");
      try {
        idcap.request("idcap://tv/checkout/request", {
          onSuccess: function() {
            log("Checkout geslaagd!");
            logCheckout(true, null);
            if (onDone) onDone(true);
            maybeReboot();
          },
          onFailure: function(f) {
            var msg = f.errorMessage || "Onbekende fout";
            log("Checkout mislukt: " + msg);
            logCheckout(false, msg);
            if (onDone) onDone(false);
          }
        });
      } catch(e) {
        log("IDCAP niet beschikbaar (simulatie)");
        logCheckout(true, "simulatie");
        if (onDone) onDone(true);
      }
    };

    var trigger_checkout = function() {
      runCheckout(null);
    };

    // Na een succesvolle checkout (dagelijks of handmatig) de TV herstarten.
    // Nodig voor installaties waar de TV/STB 24/7 aanstaat: apps zoals Netflix
    // lezen hun (gewiste) sessie pas opnieuw bij een herstart, waardoor een
    // checkout zónder herstart geen zichtbaar effect heeft.
    var rebootScheduled = false;

    function reportReboot(step, result) {
      try {
        fetch("/api/checkout/reboot-status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_key: apiKey, device_id: deviceId, step: step, result: result || null })
        }).catch(function() {});
      } catch(e) {}
    }

    function powerOffOn() {
      try {
        idcap.request("idcap://tv/power/off", {
          parameters: {},
          onSuccess: function() {
            log("TV uit (power/off), over 5s weer aan");
            reportReboot("tv/power/off", { status: "accepted" });
            setTimeout(function() {
              try {
                idcap.request("idcap://tv/power/on", {
                  parameters: {},
                  onSuccess: function() { log("TV aan (power/on)"); reportReboot("tv/power/on", { status: "accepted" }); },
                  onFailure: function(f) { log("power/on mislukt: " + (f && f.errorMessage || "onbekend")); reportReboot("tv/power/on", { status: "failed", error: f && f.errorMessage }); rebootScheduled = false; }
                });
              } catch(e) {
                log("power/on niet beschikbaar");
                reportReboot("tv/power/on", { status: "exception", error: e && e.message });
                rebootScheduled = false;
              }
            }, 5000);
          },
          onFailure: function(f) {
            log("power/off mislukt: " + (f && f.errorMessage || "onbekend"));
            reportReboot("tv/power/off", { status: "failed", error: f && f.errorMessage });
            rebootScheduled = false;
          }
        });
      } catch(e) {
        log("power/off niet beschikbaar");
        reportReboot("tv/power/off", { status: "exception", error: e && e.message });
        rebootScheduled = false;
      }
    }

    function tryReboot() {
      try {
        idcap.request("idcap://system/reboot", {
          parameters: {},
          onSuccess: function() {
            log("system/reboot geaccepteerd");
            reportReboot("system/reboot", { status: "accepted" });
            // Als de TV over 8s nog steeds draait, is de reboot niet doorgegaan → fallback
            setTimeout(function() {
              reportReboot("system/reboot", { status: "nog-actief", note: "reboot niet doorgegaan" });
              powerOffOn();
            }, 8000);
          },
          onFailure: function(f) {
            var msg = f && (f.errorMessage || JSON.stringify(f)) || "onbekend";
            log("system/reboot mislukt: " + msg + " → fallback power off/on");
            reportReboot("system/reboot", { status: "failed", error: msg });
            powerOffOn();
          }
        });
      } catch(e) {
        log("system/reboot niet beschikbaar → fallback power off/on");
        reportReboot("system/reboot", { status: "exception", error: e && e.message });
        powerOffOn();
      }
    }

    function maybeReboot() {
      if (!rebootAfterCheckout || rebootScheduled) return;
      rebootScheduled = true;
      log("TV wordt herstart om apps (Netflix e.a.) uit te loggen...");
      reportReboot("start", {});
      setTimeout(tryReboot, 1500);
    }

    // === Handmatig wissen via dashboard ===
    // De TV pollt periodiek of er een wis-verzoek klaarstaat; zo ja, direct uitvoeren.
    var wipeInProgress = false;
    var wipePollTimer = null;

    function checkPendingWipe() {
      if (!apiKey || !deviceId || wipeInProgress) return;
      fetch("/api/checkout/wipe/pending?key=" + encodeURIComponent(apiKey) + "&device_id=" + encodeURIComponent(deviceId))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data && data.pending && data.command_id) {
            executeWipe(data.command_id);
          }
        })
        .catch(function() {});
    }

    function executeWipe(commandId) {
      wipeInProgress = true;
      log("Handmatig wis-verzoek ontvangen van dashboard...");
      runCheckout(function() {
        fetch("/api/checkout/wipe/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_key: apiKey, device_id: deviceId, command_id: commandId })
        }).then(function() {
          wipeInProgress = false;
        }).catch(function() {
          wipeInProgress = false;
        });
      });
    }

    function startWipePolling() {
      if (wipePollTimer) return;
      checkPendingWipe();
      wipePollTimer = setInterval(checkPendingWipe, 15000);
    }

    var lastCheckoutDay = "";
    var scheduleTimer = null;

    function checkout_schedule() {
      fetch("/api/checkout/schedule?key=" + encodeURIComponent(apiKey) + "&hour=" + hour + "&min=" + min)
        .then(function(r) { return r.json().then(function(data) { if (!r.ok) throw new Error(data.error || "Planning mislukt"); return data; }); })
        .then(function(data) {
          if (data.enabled === false) {
            log("Automatische checkout uit (server)");
            return;
          }
          if (scheduleTimer) clearTimeout(scheduleTimer);
          log("Checkout om " + String(data.hour).padStart(2, '0') + ":" + String(data.min).padStart(2, '0'));
          log("Over " + Math.round(data.wait_ms / 60000) + " minuten");
          scheduleTimer = setTimeout(authorizeCheckout, data.wait_ms);
        })
        .catch(function() {
          log("FOUT: Planning mislukt, nieuwe poging over 1 minuut");
          scheduleTimer = setTimeout(checkout_schedule, 60000);
        });
    }

    function authorizeCheckout() {
      fetch("/api/checkout/authorize?key=" + encodeURIComponent(apiKey) + "&hour=" + hour + "&min=" + min)
        .then(function(r) { return r.json().then(function(data) { if (!r.ok) throw new Error(data.error || "Checkout niet toegestaan"); return data; }); })
        .then(function(data) {
          if (!data.allowed) {
            scheduleTimer = setTimeout(checkout_schedule, data.wait_ms);
            return;
          }
          if (data.server_day !== lastCheckoutDay) {
            lastCheckoutDay = data.server_day;
            trigger_checkout();
          }
          checkout_schedule();
        })
        .catch(function() {
          log("FOUT: Checkout kon niet worden vrijgegeven, nieuwe poging over 1 minuut");
          scheduleTimer = setTimeout(authorizeCheckout, 60000);
        });
    }

    function init() {
      apiKey = getQueryParam("key");
      var requestedHour = parseInt(getQueryParam("hour"), 10);
      var requestedMin = parseInt(getQueryParam("min"), 10);
      hour = isNaN(requestedHour) ? 11 : requestedHour;
      min = isNaN(requestedMin) ? 0 : requestedMin;
      debugOption = getQueryParam("debug") || "off";

      if (!apiKey) {
        log("FOUT: Geen API key opgegeven");
        return;
      }

      deviceId = getDeviceId();
      log("Apparaat: " + deviceId);

      fetch('/api/track/load?k=' + apiKey.slice(0, 8)).catch(function() {});

      // Eerst controleren of fetch werkt
      if (typeof fetch === 'undefined') {
        log("FOUT: fetch niet beschikbaar");
        return;
      }

      validateApiKey().then(function(valid) {
        if (!valid) return;
        startRegistration();
        getSerialNumber(function(serial) {
          if (!serial) return;
          tvSerialNumber = serial;
          log("Serienummer: " + serial);
          registerTv().catch(function() {});
        });
      }).catch(function() {
        log("FOUT: Validatie mislukt");
      });
    }
  </script>
</body>
</html>
