<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virtual PMS</title>
  <style>
    body { margin: 0; display: none; background: transparent; }
    #applist { font-size: 14px; font-family: monospace; color: #333; padding: 10px; }
  </style>
</head>
<body onload="init();">
  <p id="applist"></p>

  <script src="idcap.js"></script>
  <script>
    let hour = 11;
    let min = 0;
    let debugOption = "off";
    let apiKey = "";
    let customerId = null;
    let tvId = null;

    function log(msg) {
      const el = document.getElementById("applist");
      if (el) el.innerHTML += msg + " <br/>";
    }

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function validateApiKey() {
      return fetch("/api/checkout/validate?key=" + encodeURIComponent(apiKey))
        .then(r => r.json())
        .then(data => {
          if (data.valid) {
            customerId = data.customer_id;
            log("Klant: " + data.customer_name);
            return true;
          } else {
            log("FOUT: " + (data.error || "Ongeldige API key"));
            return false;
          }
        })
        .catch(err => {
          log("FOUT: Kan server niet bereiken");
          return false;
        });
    }

    function logCheckout(success, errorMsg) {
      const body = {
        api_key: apiKey,
        tv_id: tvId || null,
        success: success,
        error_message: errorMsg || null,
        ip_address: null,
        user_agent: navigator.userAgent
      };
      fetch("/api/checkout/log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).catch(() => {});
    }

    const getCurrentSetting = () => {
      try {
        idcap.request("idcap://configuration/property/get", {
          parameters: { key: "security_level" },
          onSuccess: function (cbObject) {
            log("security_level = " + cbObject.value);
          },
          onFailure: function () {}
        });
      } catch(e) {}
    };

    const setDebugSetting = () => {
      try {
        let ip_address = "";
        idcap.request("idcap://network/configuration/get", {
          parameters: {},
          onSuccess: function (cbObject) { ip_address = cbObject.wired.ipAddress; },
          onFailure: function () {}
        });
        idcap.request("idcap://configuration/property/set", {
          parameters: { key: "browser_debug_mode", value: "1" },
          onSuccess: function () { log("Debug mode: On! URL= " + ip_address + ":2345"); },
          onFailure: function () {}
        });
      } catch(e) {}
    };

    const destroyAllApplications = () => {
      try {
        idcap.request("idcap://application/list", {
          parameters: {},
          onSuccess: function (s) {
            s.list.forEach(function(i) {
              idcap.request("idcap://application/destroy", {
                parameters: { id: i.appId },
                onSuccess: function () { log(i.appId + " gestopt"); },
                onFailure: function () {}
              });
            });
          },
          onFailure: function () {}
        });
      } catch(e) {}
    };

    const trigger_checkout = () => {
      log("Checkout wordt uitgevoerd...");
      destroyAllApplications();
      try {
        idcap.request("idcap://tv/checkout/request", {
          onSuccess: function () {
            log("Checkout geslaagd!");
            logCheckout(true, null);
          },
          onFailure: function (f) {
            var msg = f.errorMessage || "Onbekende fout";
            log("Checkout mislukt: " + msg);
            logCheckout(false, msg);
          }
        });
      } catch(e) {
        log("IDCAP niet beschikbaar (test modus)");
        logCheckout(true, "simulatie");
      }
    };

    function checkout_schedule() {
      var now = new Date();
      var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, min, 0);
      var ms = target - now;
      if (ms < 0) ms += 86400000;
      log("Checkout om " + String(hour).padStart(2, '0') + ":" + String(min).padStart(2, '0'));
      log("Over " + Math.round(ms / 60000) + " minuten");
      setTimeout(trigger_checkout, ms);
    }

    function init() {
      apiKey = getQueryParam("key");
      hour = parseInt(getQueryParam("hour")) || 11;
      min = parseInt(getQueryParam("min")) || 0;
      debugOption = getQueryParam("debug") || "off";
      tvId = getQueryParam("tv") || null;

      if (!apiKey) {
        log("FOUT: Geen API key opgegeven");
        return;
      }

      validateApiKey().then(function(valid) {
        if (!valid) return;
        if (debugOption === "on") {
          document.body.style.display = "block";
          setTimeout(getCurrentSetting, 2000);
          setTimeout(setDebugSetting, 3000);
        }
        checkout_schedule();
      });
    }
  </script>
</body>
</html>
